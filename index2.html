<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurah By Koyel - Price List</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #ffffff;
        color: #111;
      }

      .pricing-section {
        width: 100%;
        padding: 80px 5%;
        background: #fff;
      }

      .section-title {
        text-align: center;
        margin-bottom: 60px;
      }

      .section-title h2 {
        font-size: 3rem;
        color: #000;
        font-weight: 700;
        margin-bottom: 15px;
      }

      .section-title p {
        color: #777;
        font-size: 1rem;
        letter-spacing: 1px;
      }

      .pricing-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
      }

      .pricing-card {
        background: #0f0f0f;
        border-radius: 22px;
        padding: 30px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        transition: 0.4s ease;
        position: relative;
        overflow: hidden;
      }

      .pricing-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 4px;
        background: linear-gradient(to right, #d4af37, #f7e7a9);
        transition: 0.5s;
      }

      .pricing-card:hover::before {
        left: 0;
      }

      .pricing-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }

      .pricing-card h3 {
        color: #d4af37;
        font-size: 1.8rem;
        margin-bottom: 25px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        padding-bottom: 15px;
      }

      .price-list {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .price-item {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        padding-bottom: 12px;
      }

      .price-item span:first-child {
        color: #fff;
        font-size: 0.98rem;
        line-height: 1.5;
      }

      .price-item span:last-child {
        color: #d4af37;
        font-weight: 700;
        white-space: nowrap;
      }

      .sub-heading {
        color: #f7e7a9;
        font-size: 1rem;
        margin-top: 10px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .section-title h2 {
          font-size: 2.2rem;
        }

        .pricing-card {
          padding: 25px;
        }

        .price-item {
          flex-direction: column;
          gap: 8px;
        }

        .price-item span:last-child {
          align-self: flex-start;
        }
      }
    </style>
  </head>

  <body></body>
</html>
